# Books, in the order they appear on the site.

- title: Respected and Unwanted
  slug: respected-and-unwanted
  url: https://respectedandunwanted.com
  description: >-
    Most men are handed a code: provide, protect, keep your word, don’t quit.
    It works, and it earns respect. But it comes with one rule (keep what you
    feel to yourself), and that rule costs a man the one thing respect can’t
    make up for: being wanted. This book is for the man everybody counts on
    and nobody really knows.

- title: Waking the Driver
  slug: waking-the-driver
  url: https://wakingthedriver.com
  description: >-
    You’ve driven home and not remembered the drive. Something got you there
    safely, and it wasn’t the you reading this. This book is about that
    automatic part of your mind: how it got trained, and how to catch it
    while it’s running. Each chapter ends with one small exercise, and you
    don’t need to believe anything you can’t check against your own
    experience.
